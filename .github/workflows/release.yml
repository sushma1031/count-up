name: Create Release & Tag

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml' # Only runs when pubspec.yaml is updated

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          # Extracts string after 'version: '
          VERSION_LINE=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=$(echo $VERSION_LINE | cut -d'+' -f1)

          echo "Got version: ${VERSION}"
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Check If Git Tag Exists
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            echo "::error file=pubspec.yaml::Tag $TAG_NAME already exists."
            exit 1
          fi
          echo "New version detected: $TAG_NAME"

      - name: Generate Commit Changelog
        id: generate_changelog
        run: |
          PREV_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) --exclude "*-*" || "HEAD")

          echo "Comparing $PREV_TAG to HEAD"

           # Format: * [`hash`](link) Commit message
          CHANGELOG=$(git log "$PREV_TAG..HEAD" --pretty=format:"* [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H) %s" --no-merges)

          DELIMITER="CHANGELOG_DELIMITER_$(date +%s)"
          echo "CHANGELOG<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Create Tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## What's Changed

            ${{ steps.generate_changelog.outputs.CHANGELOG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
